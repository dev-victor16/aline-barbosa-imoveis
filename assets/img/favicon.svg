<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#favBg)" />
  
  <g transform="translate(18, 14)">
    <!-- House Roof -->
    <polygon points="12,12 12,4 18,4 18,8 32,0 52,16 46,18 46,30 14,30 14,18" fill="url(#favGold)" />
    <polygon points="32,0 52,16 12,16" fill="url(#favGold)" />
    <rect x="13" y="4" width="5" height="10" fill="url(#favGold)" />
    <!-- House Body -->
    <rect x="14" y="16" width="36" height="22" rx="3" fill="url(#favGold)" />
    <!-- 4-Pane Window in dark navy -->
    <rect x="26" y="21" width="5" height="5" rx="1" fill="#0F172A" />
    <rect x="33" y="21" width="5" height="5" rx="1" fill="#0F172A" />
    <rect x="26" y="28" width="5" height="5" rx="1" fill="#0F172A" />
    <rect x="33" y="28" width="5" height="5" rx="1" fill="#0F172A" />
    <!-- Key Shaft -->
    <rect x="29" y="38" width="6" height="34" rx="1.5" fill="url(#favGold)" />
    <!-- Key Teeth -->
    <rect x="35" y="56" width="6" height="4" rx="1" fill="url(#favGold)" />
    <rect x="35" y="63" width="8" height="4" rx="1" fill="url(#favGold)" />
  </g>
</svg>
